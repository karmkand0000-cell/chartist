name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Your API server URL (https://...)'
        required: false
        default: 'https://chartist.onrender.com'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Build web bundle
        working-directory: mobile
        env:
          CHARTIST_API: ${{ github.event.inputs.api_url || vars.CHARTIST_API || 'https://chartist.onrender.com' }}
        run: |
          npm install
          node build-web.mjs
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chartist-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('app-v1.0.{0}', github.run_number) }}
          name: Chartist Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          body: Chartist Android app (debug build) connected to https://chartist.onrender.com
